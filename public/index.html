<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrivSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient"></div>

<div id="login" class="login-wrap">
    <div class="login-card">
        <div class="login-mark">PS</div>
        <h1 class="wordmark">PRIVSPACE</h1>
        <p class="muted">Private library. Sign in to continue.</p>
        <form id="login-form">
            <input id="login-user" type="text" placeholder="Username" autocomplete="username" required>
            <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" required>
            <button class="btn-accent" type="submit">Sign In</button>
        </form>
        <p id="login-error" class="err"></p>
    </div>
</div>

<div id="app" class="hidden">
    <nav id="nav">
        <div class="nav-l">
            <span class="wordmark sm">PRIVSPACE</span>
            <div class="tabs">
                <button class="tab active" data-type="movie">Films</button>
                <button class="tab" data-type="tv">Series</button>
            </div>
        </div>
        <div class="nav-r">
            <div class="search-shell">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="search" type="text" placeholder="Search titles">
            </div>
            <span id="quota-pill" class="pill hidden"></span>
            <button id="owner-btn" class="key-btn hidden" title="Owner console">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3m-3 3l2.5 2.5M14.5 8.5L17 11"/></svg>
            </button>
            <div class="who">
                <span id="who-name"></span>
                <button id="logout" class="ghost">Exit</button>
            </div>
        </div>
    </nav>

    <main>
        <section id="hero" class="hero hidden">
            <div class="hero-art"><img id="hero-img" alt=""></div>
            <div class="hero-body">
                <span class="hero-tag">Featured tonight</span>
                <h2 id="hero-title"></h2>
                <p id="hero-plot"></p>
                <button id="hero-play" class="btn-accent wide">Play</button>
            </div>
        </section>

        <section id="continue-sec" class="row-sec hidden">
            <h3 class="row-title">Continue Watching</h3>
            <div id="continue-row" class="rail"></div>
        </section>

        <div id="rows"></div>

        <section id="results-sec" class="row-sec hidden">
            <h3 class="row-title">Results</h3>
            <div id="results" class="grid"></div>
        </section>
    </main>
</div>

<div id="detail" class="overlay hidden">
    <div class="sheet">
        <button id="detail-close" class="x">&times;</button>
        <div class="sheet-head">
            <img id="d-poster" alt="">
            <div class="sheet-meta">
                <h2 id="d-title"></h2>
                <div id="d-facts" class="facts"></div>
                <p id="d-plot"></p>
                <div id="d-warn" class="warn hidden"></div>
            </div>
        </div>
        <div id="ep-sec" class="ep-sec hidden">
            <div id="season-tabs" class="chips"></div>
            <div id="ep-list" class="ep-grid"></div>
        </div>
        <div class="stage-sec">
            <div id="stage">
                <div id="frame-host"></div>
                <div id="stage-load" class="stage-veil">
                    <div class="ring"></div><span>Connecting</span>
                </div>
            </div>
            <div class="src-label">Source</div>
            <div id="sources" class="chips"></div>
        </div>
    </div>
</div>

<div id="owner" class="overlay hidden">
    <div class="sheet narrow">
        <button id="owner-close" class="x">&times;</button>
        <h2 class="pad-h">Owner Console</h2>
        <div class="pad">
            <form id="mk-user" class="stack">
                <input id="mk-name" type="text" placeholder="Username" required>
                <input id="mk-pass" type="text" placeholder="Password" required>
                <select id="mk-role">
                    <option value="freemium">Freemium — 4 films / 20 episodes daily</option>
                    <option value="premium">Premium — unlimited</option>
                </select>
                <button class="btn-accent" type="submit">Create Account</button>
            </form>
            <p id="mk-msg" class="msg"></p>
            <h4 class="sub-h">Accounts</h4>
            <div id="user-list" class="ulist"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
