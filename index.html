<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h1 class="logo">PRIVSPACE</h1>
            <p class="login-subtitle">Enter your credentials</p>
            <form id="login-form">
                <input type="text" id="login-user" placeholder="Username" required autocomplete="off">
                <input type="password" id="login-pass" placeholder="Password" required>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <!-- Main App -->
    <nav class="navbar">
        <div class="nav-left">
            <h1 class="logo">PRIVSPACE</h1>
            <div class="nav-links">
                <button class="nav-btn active" data-type="movie">Movies</button>
                <button class="nav-btn" data-type="tv">TV Shows</button>
            </div>
        </div>
        <div class="nav-right">
            <input type="text" id="search" placeholder="Search titles...">
            <div class="user-menu">
                <button id="owner-btn" class="owner-btn hidden" title="Owner Panel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                </button>
                <div class="user-profile">
                    <span id="current-user-display">User</span>
                    <button id="logout-btn" class="logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="grid" class="content-grid"></main>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-container">
            <button id="close" class="close-btn">&times;</button>
            
            <div class="modal-header">
                <img id="m-poster" src="" alt="">
                <div class="modal-info">
                    <h2 id="m-title"></h2>
                    <p id="m-plot"></p>
                    <div id="limit-warning" class="limit-warning hidden"></div>
                </div>
            </div>

            <div id="episode-selector" class="episode-section hidden">
                <h3>Browse Episodes</h3>
                <div id="season-tabs" class="season-tabs"></div>
                <div id="episode-list" class="episode-grid"></div>
            </div>

            <div class="player-section">
                <div id="player-container">
                    <div id="output"></div>
                    <div id="loading" class="loading-overlay">
                        <div class="spinner"></div>
                        <p>Connecting to stream...</p>
                    </div>
                    <div id="error-msg" class="error-overlay hidden">
                        <p>Not available on this provider.</p>
                        <small>Scroll down and switch to another source.</small>
                    </div>
                </div>
                <div id="source-list" class="source-buttons"></div>
            </div>
        </div>
    </div>

    <!-- Owner Panel Modal -->
    <div id="owner-modal" class="modal-overlay hidden">
        <div class="modal-container small-modal">
            <button id="close-owner" class="close-btn">&times;</button>
            <h2>Owner Panel</h2>
            <form id="create-user-form">
                <input type="text" id="new-username" placeholder="Username" required>
                <input type="password" id="new-password" placeholder="Password" required>
                <select id="new-role">
                    <option value="freemium">Freemium (4 movies / 20 eps per day)</option>
                    <option value="premium">Premium (Unlimited)</option>
                </select>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <div id="owner-message" class="success-text"></div>
            
            <h3 class="mt-4">Existing Users</h3>
            <ul id="user-list" class="user-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
